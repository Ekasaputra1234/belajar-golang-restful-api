version: "3.9"
services:
  web:
    restart: always
    container_name: CHICK-SERVICE-MASTER-PROJECT
    image: gitlab.com/voltunes/api-master-project:${TAG}
    environment:
      - TZ=Asia/Jakarta
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "1m"

networks:
  default:
    external:
      name: chick